spring.datasource.url=jdbc:h2:mem:stockpilot_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

stockpilot.food-api.base-url=https://world.openfoodfacts.org
stockpilot.food-api.user-agent=StockPilot-Test/1.0 (https://example.com)
stockpilot.food-api.timeout-ms=1000
