spring.application.name=stockpilot-api
spring.datasource.url=jdbc:h2:file:./data/stockpilot
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never

# Set a real project URL or contact address before live use.
stockpilot.food-api.base-url=${FOOD_API_BASE_URL:https://world.openfoodfacts.org}
stockpilot.food-api.user-agent=${FOOD_API_USER_AGENT:StockPilot-Internship/1.0 (https://example.com)}
stockpilot.food-api.timeout-ms=${FOOD_API_TIMEOUT_MS:3000}

stockpilot.food-cache.ttl-seconds=${FOOD_CACHE_TTL_SECONDS:300}
stockpilot.food-cache.max-entries=${FOOD_CACHE_MAX_ENTRIES:500}
